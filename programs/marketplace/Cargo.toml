[package]
name = "marketplace"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "marketplace"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build","anchor-spl/idl-build"]
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = {version="0.31.1", features=["init-if-needed"]}
anchor-spl="0.31.1"
mpl-core= {version="0.11.1", features=["anchor"]}

[dev-dependencies]
# litesvm = "0.12.0"
# litesvm-token = "0.12.0"
anchor-litesvm = "0.2.0"
solana-keypair = "3.1.2"
# (Transaction v4.X not supported by liteSVM ??).
solana-message = "3.1.0"
solana-pubkey = "3.0.0"
solana-signer = "3.0.0"
solana-transaction = { version = "3.1.0", features = ["bincode"] }
solana-clock = "3.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

